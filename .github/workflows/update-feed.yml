name: Update personalized RSS feed and build podcast

on:
  schedule:
    # Every 3 hours. Edit the cron expression to change frequency.
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "generate_feed.py"
      - "ingest_feed.py"
      - "write_script.py"
      - ".github/workflows/update-feed.yml"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python generate_feed.py --config config.yaml --out output/feed.xml

      # --- Podcast pipeline steps ---

      - name: Ingest feed into pipeline format
        run: python ingest_feed.py
        env:
          PODCAST_FEED_PATH: output/feed.xml

      - name: Write podcast script
        run: python write_script.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_NAME: "Your Daily Briefing"

      # TTS + audio publishing steps will go here once we build them

      # --- Commit whatever should be public ---

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/feed.xml
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update feed.xml [skip ci]"
          git push