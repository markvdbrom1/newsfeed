# -----------------------------------------------------------------------
# Personalized News Feed — configuration
# Edit the values below, commit, and push. The next scheduled run (or a
# manual "Run workflow" click in the GitHub Actions tab) will pick up
# your changes automatically.
# -----------------------------------------------------------------------

feed:
  title: "My Personalized News"
  description: "Curated news based on my interests"
  # Set this to your future GitHub Pages URL, e.g.
  # https://YOUR_USERNAME.github.io/YOUR_REPO/feed.xml
  link: "https://YOUR_USERNAME.github.io/YOUR_REPO/feed.xml"
  # Max total items kept in the final feed, across all keywords
  max_items: 60
  # Drop anything older than this many days
  max_age_days: 3
  # Max items pulled per keyword, before dedup/trim
  items_per_keyword: 10
  # Language/region passed to Google News (affects results & wording)
  language: "en-US"
  country: "US"

# One keyword or phrase per line. Phrases are matched as Google News
# search queries, so you can use quotes, OR, site:, -exclusions, etc.
# Examples:
#   - "generative AI"
#   - climate policy
#   - Formula 1
#   - "electric vehicles" -Tesla
#   - site:nature.com quantum computing
keywords:
  - "generative AI"
  - "climate policy"
  - "Formula 1"
